{% extends 'base.html' %}{% block content %}
<div id="api-message">
</div>
<div class="section-heading">
  <h1>Manage products</h1>
  <button class="button" id="new-product">Add product</button>
</div>
<form id="product-form" class="card admin-form hidden">
  <h2 id="form-title">Add product</h2>
  <input type="hidden" name="id">
  <label>Name<input name="name" required>
  </label>
  <label>Description<textarea name="description" required>
  </textarea>
</label>
<label>Price (₹)<input name="price" type="number" min="0" step="1" required>
</label>
<label>Category<input name="category" required>
</label>
<label>Stock<input name="stock" type="number" min="0" required>
</label>
<label>Image URL<input name="image">
</label>
<button class="button">Save product</button>
</form>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for p in products %}
        <tr data-product='{{ {"id":p.id,"name":p.name,"description":p.description,"price":p.price|string,"category":p.category,"stock":p.stock,"image":p.image or ""}|tojson }}'>
          <td>{{p.id}}</td>
          <td>{{p.name}}</td>
          <td>{{p.category}}</td>
          <td>₹{{p.price|inr}}</td>
          <td>{{p.stock}}</td>
          <td>
            <button class="text-button edit-product">Edit</button>
            <button class="text-button delete-product" data-id="{{p.id}}">Delete</button>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
